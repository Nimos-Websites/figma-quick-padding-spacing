<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Inter, sans-serif; padding: 12px; margin: 0; color: #333; }
    h3 { margin-top: 0; font-size: 14px; }
    .row { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    label { font-size: 12px; }
    input[type="number"] { width: 64px; padding: 4px; border: 1px solid #e5e5e5; border-radius: 4px; }
    button { background: #0D99FF; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 500; }
    button:hover { background: #0b82db; }
    .hint { font-size: 11px; color: #888; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h3>Quick Padding &amp; Spacing</h3>
  <div class="row">
    <label for="spacing">Padding + gap (px):</label>
    <input type="number" id="spacing" value="16" min="0" max="200" step="1">
  </div>
  <button id="normalize">Normalize selected frames</button>
  <div class="hint">Works on auto-layout frames in your selection.</div>

  <script>
    document.getElementById('normalize').onclick = () => {
      const raw = document.getElementById('spacing').value;
      const val = Number(raw);
      parent.postMessage({ pluginMessage: { type: 'normalize', targetSpacing: val } }, '*');
    };
  </script>
</body>
</html>
